name: Deploy Node.js App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        # تم التحديث إلى v4 لحل التحذير الخاص بـ Node.js 20
        uses: actions/checkout@v4 

      - name: Setup Node.js
        # تم التحديث إلى v4 لحل التحذير الخاص بـ Node.js 20
        uses: actions/setup-node@v4 
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Setup MongoDB
        uses: supercharge/mongodb-github-action@1.8.0
        with:
          mongodb-version: '5.0'

      - name: Use Secret in Environment
        run: echo "MY_SECRET=${{ secrets.ALAA_HEMDAN }}" >> $GITHUB_ENV

      # تم إزالة خطوة node server.js لأنها سبب التعليق الرئيسي
      # إذا كان مشروعك يحتاج إلى بناء (Build) قبل النشر، استخدم الأمر التالي:
      # - name: Build Project
      #   run: npm run build
